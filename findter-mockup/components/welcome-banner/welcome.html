<div id=fdt-welcome class=fdt-welcome hidden>
<div class=fdt-welcome__backdrop data-dismiss=backdrop>
</div>
<div class=fdt-welcome__dialog role=dialog aria-modal=true aria-label="Welcome to Findter">
<button type=button class=fdt-welcome__close data-dismiss=close_button aria-label=Close>
<span aria-hidden=true>&times;
</span>
</button>
<div class=fdt-welcome__stage id=fdt-welcome-stage tabindex=0>
<img id=fdt-welcome-image class=fdt-welcome__image alt="Enjoy 14-day free trial with unlimited features">
<p id=fdt-welcome-fallback class=fdt-welcome__fallback hidden>Mobile banner is not configured for this slide.
</p>
</div>
<div class=fdt-welcome__controls id=fdt-welcome-controls hidden>
<button type=button class=fdt-welcome__nav data-slide=prev aria-label="Previous slide">Previous
</button>
<div class=fdt-welcome__dots id=fdt-welcome-dots role=tablist aria-label=Slides>
</div>
<button type=button class=fdt-welcome__nav data-slide=next aria-label="Next slide">Next
</button>
</div>
<div class=fdt-welcome__actions>
<button type=button class=fdt-welcome__continue data-dismiss=continue>Continue
</button>
</div>
</div>
</div>
