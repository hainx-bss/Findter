<div id=fdt-hf class=fdt-hf hidden>
<div id=fdt-hf-page class=fdt-hf__page>
<s-stack gap=large>
<s-stack gap=small>
<s-heading>Discover Findter</s-heading>
<s-paragraph color=subdued>Look through the features below while your store data is collected.</s-paragraph>
</s-stack>
<s-banner id=fdt-hf-banner heading="Collecting data" tone=warning>Up-to-date data are being collected. Please wait until this process is complete before continuing with the app.</s-banner>
<s-section heading="Highlight features">
<s-stack gap=base>
<s-paragraph color=subdued>Choose a group, then preview a feature.</s-paragraph>
<s-stack id=fdt-hf-tabs direction=inline gap=small alignItems=center role=tablist aria-label="Feature groups"></s-stack>
<div id=fdt-hf-body></div>
</s-stack>
</s-section>
<s-stack id=fdt-hf-continue direction=inline justifyContent=end hidden>
<s-button type=button id=fdt-hf-home variant=primary>Continue to Homepage</s-button>
</s-stack>
</s-stack>
</div>
<div id=fdt-hf-advanced class=fdt-hf__page hidden>
<s-section heading="Advanced features">
<s-box id=fdt-hf-advanced-focus border=base borderRadius=base padding=base background=subdued></s-box>
</s-section>
</div>
<s-modal id=fdt-hf-media heading=Preview size=large>
<div id=fdt-hf-media-stage class=fdt-hf__media-stage></div>
<s-button slot=secondary-actions commandFor=fdt-hf-media command=--hide>Close</s-button>
</s-modal>
</div>
