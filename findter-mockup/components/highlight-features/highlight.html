<div id=fdt-hf class=fdt-hf hidden>
<div id=fdt-hf-page class=fdt-hf__page>
<header class=fdt-hf__intro>
<h1>Discover Findter</h1>
<p>Look through the features below while your store data is collected.</p>
</header>
<div id=fdt-hf-banner class=fdt-hf__banner></div>
<section class=fdt-hf__card aria-label="Highlight features">
<div class=fdt-hf__head>
<div>
<h2 class=fdt-hf__title>Highlight features</h2>
<p class=fdt-hf__lead>Choose a group, then preview a feature.</p>
</div>
<div id=fdt-hf-tabs class=fdt-hf__tabs role=tablist aria-label="Feature groups"></div>
</div>
<div id=fdt-hf-body class=fdt-hf__body></div>
</section>
<div id=fdt-hf-continue class=fdt-hf__continue hidden>
<button type=button id=fdt-hf-home class=fdt-hf__primary>Continue to Homepage</button>
</div>
</div>
<div id=fdt-hf-advanced class=fdt-hf__advanced hidden>
<h1>Advanced features</h1>
<p id=fdt-hf-advanced-focus class=fdt-hf__focus></p>
</div>
<div id=fdt-hf-media class=fdt-hf__modal hidden>
<button type=button class=fdt-hf__backdrop data-close=media aria-label="Close preview"></button>
<div class=fdt-hf__dialog role=dialog aria-modal=true aria-labelledby=fdt-hf-media-title>
<div class=fdt-hf__dialog-head>
<h2 id=fdt-hf-media-title>Preview</h2>
<button type=button class=fdt-hf__x data-close=media aria-label=Close>&times;</button>
</div>
<div id=fdt-hf-media-stage class=fdt-hf__stage></div>
</div>
</div>
</div>
